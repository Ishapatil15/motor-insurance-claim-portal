---
# ==============================================================================
# Automated Rollback Playbook: Revert to Previous Stable Release
# ==============================================================================
- name: Rollback Motor Insurance Claim Portal to Stable Release
  hosts: claim_servers
  become: true
  vars:
    rollback_version: "{{ target_version | default('1.0.0') }}"

  tasks:
    - name: Verify stable rollback release directory exists
      ansible.builtin.stat:
        path: "{{ releases_dir }}/{{ rollback_version }}/claim-portal.jar"
      register: rollback_artifact
      failed_when: not rollback_artifact.stat.exists

    - name: Revert current symlink to target stable release {{ rollback_version }}
      ansible.builtin.file:
        src: "{{ releases_dir }}/{{ rollback_version }}"
        dest: "{{ current_symlink }}"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"

    - name: Restart claim-portal systemd service
      ansible.builtin.systemd:
        name: claim-portal
        state: restarted

    - name: Verify rollback deployment health probe
      ansible.builtin.uri:
        url: "{{ health_check_url }}"
        status_code: 200
        return_content: true
      register: rollback_health
      until: rollback_health.status == 200 and 'UP' in rollback_health.content
      retries: 8
      delay: 3

    - name: Display rollback confirmation
      ansible.builtin.debug:
        msg: "RECOVERY COMPLETE: Motor Insurance Claim Portal successfully rolled back to v{{ rollback_version }}. Service is healthy."
